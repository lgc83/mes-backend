# ===========================================
# OAuth2 소셜 로그인 설정
# ===========================================
# ⚠️ 아래 Client ID / Secret 은 각 개발자 콘솔에서 발급받아 넣어야 합니다.
# 발급 전까지는 소셜 로그인 버튼을 비활성화하거나, 에러가 발생합니다.
# ===========================================

spring:
  security:
    oauth2:
      client:
        registration:
          # ----- 구글 (가장 간단) -----
          # 1. https://console.cloud.google.com 접속
          # 2. 프로젝트 생성 → API 및 서비스 → 사용자 인증 정보
          # 3. OAuth 2.0 클라이언트 ID 생성 (웹 애플리케이션)
          # 4. 승인된 리디렉션 URI: http://localhost:9500/login/oauth2/code/google
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: email, profile

          # ----- 카카오 ----- (application.yml에 정의됨 - 여기서 제외)
          # ----- 네이버 -----
          # 1. https://developers.naver.com 접속
          # 2. 애플리케이션 등록 → Client ID, Client Secret 발급
          # 3. API 설정 → 회원정보(이메일, 이름, 프로필사진) 사용 API
          # 4. Callback URL: http://localhost:9500/login/oauth2/code/naver
          naver:
            client-id: ${NAVER_CLIENT_ID:your-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:your-naver-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email, profile_image
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
